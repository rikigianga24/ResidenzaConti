# Virtual host nginx per residenzaconti.it (VPS IONOS, separato da AiuolaLab).
# Da adattare alla configurazione del VPS: [DA FORNIRE] (percorsi, certificati).
# Installazione tipica:
#   /etc/nginx/sites-available/residenzaconti.conf  →  link in sites-enabled
#   certificati con certbot (Let's Encrypt, rinnovo automatico)
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS, e senza www → con www
server {
    listen 80;
    listen [::]:80;
    server_name residenzaconti.it www.residenzaconti.it;
    # necessario per il rinnovo di Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.residenzaconti.it$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name residenzaconti.it;
    ssl_certificate     /etc/letsencrypt/live/residenzaconti.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/residenzaconti.it/privkey.pem;
    return 301 https://www.residenzaconti.it$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.residenzaconti.it;

    ssl_certificate     /etc/letsencrypt/live/residenzaconti.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/residenzaconti.it/privkey.pem;

    # cartella dove si carica il contenuto di dist/ (utente e log separati da AiuolaLab)
    root /var/www/residenzaconti;
    index index.html;
    access_log /var/log/nginx/residenzaconti.access.log;
    error_log  /var/log/nginx/residenzaconti.error.log;

    # --- header di sicurezza ---
    # CSP: il sito carica solo risorse proprie (niente script/stili inline, niente terze parti)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # compressione
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # --- redirect 301 dai vecchi URL WordPress (tenere allineati con src/i18n/redirect.mjs) ---
    location ~ ^/dettaglio/?$                    { return 301 /casa/; }
    location ~ ^/en/dettaglio-appartamento/?$    { return 301 /en/the-house/; }
    location ~ ^/en/dettaglio/?$                 { return 301 /en/the-house/; }
    location ~ ^/en/galleria/?$                  { return 301 /en/gallery/; }
    location ~ ^/en/contatti/?$                  { return 301 /en/contact/; }
    # vecchi file WordPress: spariti per sempre
    location ~ ^/(wp-admin|wp-content|wp-includes|wp-login\.php|xmlrpc\.php) { return 410; }

    # file con hash nel nome (CSS, JS, immagini ottimizzate): cache lunga
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # gli add_header nei location sostituiscono quelli del server: si ripetono i principali
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # calendario generato dal job iCal: mai in cache
    location = /disponibilita.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
